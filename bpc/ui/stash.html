  if(!matchMedia('(prefers-reduced-motion:reduce)').matches){ val.classList.remove('flash'); void val.offsetWidth; val.classList.add('flash'); }
}

/* re-search: loads show saved prices; this button re-runs every trade search */
function fmtLocal(tsSec){           // the user's local time + timezone
  try{ return new Date(tsSec*1000).toLocaleString(undefined,
    {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }
  catch(e){ return ''; }
}
function updateSavedNote(){
  const row=$('#researchRow'); if(!row) return;
  row.hidden = !bpc.state.meta;
  const ts=bpc.state.savedTs;
  $('#savedNote').textContent = ts
    ? (bpc.state.fromSaved ? 'cached · last searched '+fmtLocal(ts) : 'searched '+fmtLocal(ts))
    : '';
}
bpc.on('state', updateSavedNote);
$('#reAll').addEventListener('click',()=>{ bpc.researchAll(); });
function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):s; }

/* ---------- ADVANCED PICKER — multi stat-group editor (render on 'rare' event) ----------
   Mirrors the trade site: the item's affixes live in one or more stat GROUPS, each with a
   type (And / Count / Not / If) and threshold. Submitting emits a `groups` payload that the
   backend turns into the PoE1 trade query.stats array.
   NOTE: Weighted Sum (weight / weight2) is intentionally NOT offered -- the PoE1 trade SEARCH API
   rejects weighted groups with HTTP 400 (verified); a Count group is the supported equivalent
   ("how many of these you want"). Any legacy weighted group is coerced to Count server-side. */
const pickwrap=$('#pickwrap'), pick=$('#pick');
let curRare=null, pkInfo=null, pkModel=null;
const GROUP_TYPE_OPTS=[['and','And (all)'],['count','Count (≥N)'],
  ['not','Not (exclude)'],['if','If (only if present)']];

const SURVEY_TIERS=[['required','Required'],['nice','Nice to have'],['notimp','Not important'],['skip','Unnecessary']];
bpc.on('rare',info=>{
  if(!info){ pickwrap.classList.remove('show'); pick.innerHTML=''; curRare=null; pkInfo=null; pkModel=null; return; }
  pkInfo=info; curRare=info;
  pkModel={ usePseudo:!!(info.rare.pseudo&&info.rare.pseudo.length), view:'survey',
            groups:[{type:'and',min:'',max:''}], statRows:[], equipRows:[], unsearch:[], added:[], saved:{} };
  pkBuildRows();
  pkDraw();
});
// the picker opens to the CLASSIC flat affix list by DEFAULT; ticking "survey me" (global
// toggle) shows the mod-priority survey, from which "edit groups" reveals the full group editor.
let pkSurvey=(function(){ try{ return localStorage.getItem('bpc_surveypick')==='1'; }catch(e){ return false; } })();
function pkDraw(){ if(!pkSurvey) pkRenderClassic(); else if(pkModel.view==='groups') pkRender(); else pkRenderSurvey(); }
// key for snapshot/restore across re-render. Must include the mod TEXT, not just stat_id:
// two affixes on one item can map to the same stat_id (e.g. base + crafted "+life"), and rid
// is reassigned each rebuild, so a stat_id-only key would collide and cross-contaminate rows.
// snapshot/restore key. Added (off-item) stats use a unique instance id (aid) so the SAME
// stat added to two groups stays independent; item rows key by stat_id+text.
function pkRowKey(a){ return a.added ? ('add:'+a.aid) : (a.kind==='equip' ? ('eq:'+a.key) : ('sid:'+a.stat_id+'#'+a.text)); }
function pkMkRow(rid,a){
  return { rid, kind:a.kind, stat_id:a.stat_id, key:a.key, text:a.text, value:a.value,
    negated:!!a.negated, resist:!!a.resist, checked:(a.prefer!==undefined?!!a.prefer:true),
    min:(a.value!=null&&!a.negated)?String(a.value):'', max:(a.value!=null&&a.negated)?String(a.value):'',
    weight:'', group:0, tier:(a.priority || (a.searchable===false?'skip':'nice')) };
}
// pkModel.saved is a PERSISTENT per-build store of row edits keyed by a stable instance key
// (skey). It accumulates, so edits survive a row being temporarily removed (e.g. resist rows
// while "combine resistances" is on) and two rows sharing stat_id+text get distinct keys.
function pkSaveState(){
  pkModel.saved=pkModel.saved||{};
  pkModel.statRows.concat(pkModel.equipRows).forEach(rw=>{
    if(rw.skey) pkModel.saved[rw.skey]={checked:rw.checked,min:rw.min,max:rw.max,weight:rw.weight,group:rw.group,tier:rw.tier};
  });
}
function pkBuildRows(){
  const r=pkInfo.rare; let rid=0; const stat=[],equip=[],uns=[]; const occ={};
  const saved=pkModel.saved||{};
  const skeyOf=row=>{ const base=pkRowKey(row); const n=(occ[base]=(occ[base]||0)+1)-1; return base+(n?'@'+n:''); };
  (r.affixes||[]).forEach(a=>{
    if(pkModel.usePseudo && a.resist) return;            // replaced by the pseudo total
    if(!a.searchable){ uns.push({text:a.text,reason:a.reason}); return; }
    if(a.kind==='equip') equip.push(pkMkRow(rid++,a)); else stat.push(pkMkRow(rid++,a));
  });
  if(pkModel.usePseudo) (r.pseudo||[]).forEach(p=>{ if(p.searchable) stat.push(pkMkRow(rid++,p)); });
  // route ITEM rows: restore saved edits, else default into the first AND/Count group
  // (group 0 may have been changed to Not/Weight/etc).
  const di=pkModel.groups.findIndex(g=>g.type==='and'||g.type==='count'); const defGrp=di<0?0:di;
  stat.concat(equip).forEach(rw=>{
    rw.skey=skeyOf(rw); const s=saved[rw.skey];
    if(s){ rw.checked=s.checked; rw.min=s.min; rw.max=s.max; rw.weight=s.weight;
           rw.group=Math.min(s.group, pkModel.groups.length-1); if(s.tier) rw.tier=s.tier; }
    else rw.group=defGrp;
  });
  // off-item stats the user added via "+ add stat filter"
  (pkModel.added||[]).forEach(a=>{
    const row={rid:rid++, kind:'stat', added:true, aid:a.aid, stat_id:a.stat_id, key:null, text:a.text, value:null,
      negated:false, resist:false, checked:true, min:'', max:'', weight:'', group:Math.min(a.group, pkModel.groups.length-1),
      tier:(a.tier||'nice')};
    row.skey=skeyOf(row); const s=saved[row.skey];
    if(s){ row.checked=s.checked; row.min=s.min; row.max=s.max; row.weight=s.weight; row.group=Math.min(s.group, pkModel.groups.length-1); if(s.tier) row.tier=s.tier; }
    a.group=row.group; a.tier=row.tier;   // keep added[] in sync with drags/restores
    stat.push(row);
  });
  pkModel.statRows=stat; pkModel.equipRows=equip; pkModel.unsearch=uns;
}
function pkGridClass(gtype,isEq){ if(isEq) return 'r4'; return (gtype==='weight'||gtype==='weight2')?'r5':'r4'; }
function pkAfxHead(gtype){
  if(gtype==='__eq') return `<div class="afx afxhead r4"><div></div><div></div><div class="mmhead">min</div><div class="mmhead">max</div><div></div></div>`;
  const isW=(gtype==='weight'||gtype==='weight2');
  return `<div class="afx afxhead ${isW?'r5':'r4'}"><div></div><div></div><div class="mmhead">min</div><div class="mmhead">max</div>${isW?'<div class="mmhead">wt</div>':''}<div></div></div>`;
}
function pkRowHTML(row,gtype){
  const isW=(gtype==='weight'||gtype==='weight2'), isEq=(row.kind==='equip');
  const shown=row.value!=null?Math.abs(row.value):null;
  const txt=shown!=null?E(row.text).replace(String(shown),`<span class="roll">${E(shown)}</span>`):E(row.text);
  const range=(!isEq&&row.value!=null)?` <span class="range">${row.negated?('(red. → '+E(row.value)+')'):('(rolled '+E(row.value)+')')}</span>`
    :(row.added?` <span class="range">(off-item)</span>`:'');
  let cells=`<label class="abullet"><input type="checkbox" class="acb" data-rid="${row.rid}" ${row.checked?'checked':''}><span class="dia"><span>✔</span></span></label>`
    +`<div class="atext">${txt}${range}</div>`
    +`<input class="mm amin" data-rid="${row.rid}" inputmode="decimal" value="${E(row.min)}" placeholder="–">`
    +`<input class="mm amax" data-rid="${row.rid}" inputmode="decimal" value="${E(row.max)}" placeholder="–">`;
  if(!isEq && isW) cells+=`<input class="mm awt" data-rid="${row.rid}" inputmode="decimal" value="${E(row.weight)}" placeholder="1">`;
  // trailing cell: remove-✕ for user-added off-item stats, empty otherwise (keeps cols aligned)

  // stat rows drag between group boxes; equip (defence-total) rows stay put
  const drag = isEq ? '' : ' draggable="true"';
  return `<div class="afx ${pkGridClass(gtype,isEq)}${isEq?'':' draggable-row'}${row.added?' added':''}" data-rid="${row.rid}"${drag}>${cells}</div>`;
}
function pkGroupBox(g,gi){

  else if(isW) thr=`<span class="grpthr">sum ≥ <input class="mm gmin" data-gi="${gi}" inputmode="decimal" value="${E(g.min)}" placeholder="–"></span>`;
  const typeSel=`<select class="stone-sel grptype" data-gi="${gi}">`+GROUP_TYPE_OPTS.map(([v,l])=>`<option value="${v}" ${g.type===v?'selected':''}>${E(l)}</option>`).join('')+`</select>`;

  if(!info.single&&remain>1) h+=`<div class="pbulk"><button class="stone-btn pa-skip small" id="pSkipAll" type="button">skip all (don't price)</button></div>`;

function pkSyncDOM(){

function pkMoveRow(rid,gi){ const rw=pkModel.statRows.find(r=>String(r.rid)===String(rid)); if(rw) rw.group=gi; }
/* ---- off-item stat search ("+ add stat filter") ---- */
let STAT_INDEX=null, STAT_LOADING=null;
function pkEnsureStats(){
  if(STAT_INDEX) return Promise.resolve(STAT_INDEX);
  if(STAT_LOADING) return STAT_LOADING;
  STAT_LOADING=fetch('/api/stats').then(r=>r.json()).then(d=>{
    const flat=[]; (d.groups||[]).forEach(g=>(g.entries||[]).forEach(e=>flat.push({id:e.id,text:e.text,type:g.label,lc:(e.text||'').toLowerCase()})));
    STAT_INDEX=flat; return flat;
  }).catch(()=>{ STAT_INDEX=[]; return STAT_INDEX; });
  return STAT_LOADING;
}
function pkSearchStats(q){
  q=(q||'').trim().toLowerCase(); if(!q||!STAT_INDEX) return [];
  const terms=q.split(/\s+/), hits=[];
  for(const s of STAT_INDEX){ if(terms.every(t=>s.lc.indexOf(t)>=0)){ hits.push(s); if(hits.length>=400) break; } }
  hits.sort((a,b)=>((a.lc.startsWith(q)?0:1)-(b.lc.startsWith(q)?0:1)) || (a.text.length-b.text.length));
  return hits.slice(0,40);
}
function pkSyncCurrent(){ if(!pkSurvey||pkModel.view==='groups') pkSyncDOM(); else pkSyncSurvey(); }
let pkAidSeq=0;
function pkAddStat(gi,id,text){
  pkSyncCurrent(); pkSaveState(); pkModel.added=pkModel.added||[];
  pkModel.added.push({aid:++pkAidSeq, stat_id:id, text:text, group:gi||0, tier:'nice'});  // unique aid per add

}
function pkRemoveStat(rid){
  pkSyncCurrent(); pkSaveState(); const rw=pkModel.statRows.find(r=>String(r.rid)===String(rid));
  if(rw && rw.added) pkModel.added=(pkModel.added||[]).filter(a=>a.aid!==rw.aid);  // remove just this one
  pkBuildRows(); pkDraw();
}
function pkRemoveGroup(gi){
  if(pkModel.groups.length<=1) return;
  pkModel.groups.splice(gi,1);
  pkModel.statRows.forEach(rw=>{ if(rw.group===gi) rw.group=0; else if(rw.group>gi) rw.group--; });
}
function pkBuildPayload(){
  pkSyncDOM();
  const groups=pkModel.groups.map((g,gi)=>{
    const isW=(g.type==='weight'||g.type==='weight2');
    const rowsIn=pkModel.statRows.filter(rw=>rw.group===gi&&rw.checked);
    const filters=rowsIn.map(rw=>{
      const f={stat_id:rw.stat_id, min:numv(rw.min), max:numv(rw.max)};
      if(isW) f.weight=(rw.weight===''?1:numv(rw.weight));
      return f;
    });
    const o={type:g.type, filters};
    if(g.type==='count'){
      // clamp to [1, #filters] so a stale typed value can't require N-of-fewer (never matches)
      let m=numv(g.min); if(m==null) m=filters.length;
      o.min=Math.max(1, Math.min(m, filters.length));
    } else if(isW){
      let m=numv(g.min);
      if(m==null){            // default the sum threshold to the build's own weighted total
        // signed basis: reduced/negative-value mods contribute 0 (they score negative on trade,
        // so counting them positively would over-inflate the threshold)
        m=Math.round(rowsIn.reduce((s,rw)=>s+(rw.weight===''?1:(numv(rw.weight)||0))*(rw.value!=null?Math.max(0,rw.value):1),0));
        if(!(m>0)) m=1;
      }
      o.min=m;
    }
    return o;
  }).filter(g=>g.filters.length);
  const equip=pkModel.equipRows.filter(rw=>rw.checked).map(rw=>({key:rw.key, min:numv(rw.min), max:numv(rw.max)}));
  return {groups,equip};
}
function pkSubmit(){ bpc.submitRare(pkInfo.key, pkBuildPayload()); }
/* build a clickable trade ?q= URL from the CURRENT picker config (no search/commit) */
function pkGroupsToStats(groups){
  return (groups||[]).map(g=>{
    const isW=(g.type==='weight'||g.type==='weight2');
    const filters=(g.filters||[]).map(f=>{ const val={};
      if(f.min!=null)val.min=f.min; if(f.max!=null)val.max=f.max; if(isW&&f.weight!=null)val.weight=f.weight;
      const o={id:f.stat_id}; if(Object.keys(val).length)o.value=val; return o; });
    const o={type:g.type, filters}; if(g.min!=null)o.value={min:g.min}; return o;
  });
}
function pkBuildTradeUrl(payload){
  const meta=bpc.state.meta||{};
  const scope=(pkInfo.rare && pkInfo.rare.scope_q) ? JSON.parse(JSON.stringify(pkInfo.rare.scope_q)) : {};
  const query=Object.assign({status:{option:meta.status||'online'}}, scope);
  query.stats=pkGroupsToStats(payload.groups);
  if(payload.equip && payload.equip.length){
    const ef={}; payload.equip.forEach(e=>{ const v={}; if(e.min!=null)v.min=e.min; if(e.max!=null)v.max=e.max; if(Object.keys(v).length)ef[e.key]=v; });
    if(Object.keys(ef).length){ query.filters=query.filters||{}; query.filters.armour_filters={filters:ef}; }
  }
  const q=encodeURIComponent(JSON.stringify({query, sort:{price:'asc'}}));
  return `https://www.pathofexile.com/trade/search/${encodeURIComponent(meta.league||'')}?q=${q}`;
}
function pkViewTrade(payload){ const u=pkBuildTradeUrl(payload); if(u) window.open(u,'_blank','noopener'); }
/* Trade link for a BOARD card. Prefer the server's link when it's already a ?q= search (a fresh
   appraisal -- may be a custom survey query); otherwise (a stale, expiring query-id link from an
   old saved result, or none at all) rebuild a default base-type ?q= search from the item's own
   affixes so a click ALWAYS lands on the right, valid, never-expiring trade page. */
function cardTradeUrl(k){
  const p=bpc.state.priced[k];
  if(p && p.trade_url && p.trade_url.indexOf('?q=')>=0) return p.trade_url;
  const r=bpc.state.rares && bpc.state.rares[String(k)];
  if(r){ try{
    const meta=bpc.state.meta||{};
    const usePseudo=!!(r.pseudo && r.pseudo.length);
    const want=a=>(a.prefer!==undefined?!!a.prefer:!!a.searchable);
    const statF=a=>(a.negated?{stat_id:a.stat_id,min:null,max:a.value}:{stat_id:a.stat_id,min:a.value,max:null});
    const filters=[], equip=[];
    (r.affixes||[]).forEach(a=>{ if(!a.searchable||!want(a))return; if(usePseudo&&a.resist)return;
      if(a.kind==='equip') equip.push({key:a.key,min:a.value,max:null}); else filters.push(statF(a)); });
    if(usePseudo) (r.pseudo||[]).forEach(pp=>{ if(pp.searchable&&want(pp)) filters.push(statF(pp)); });
    const scope=r.scope_q?JSON.parse(JSON.stringify(r.scope_q)):{};
    const query=Object.assign({status:{option:meta.status||'online'}}, scope);
    query.stats=pkGroupsToStats([{type:'and',min:null,max:null,filters:filters}]);
    if(equip.length){ const ef={}; equip.forEach(e=>{const v={}; if(e.min!=null)v.min=e.min; if(e.max!=null)v.max=e.max; if(Object.keys(v).length)ef[e.key]=v;}); if(Object.keys(ef).length){query.filters=query.filters||{}; query.filters.armour_filters={filters:ef};} }
    const q=encodeURIComponent(JSON.stringify({query, sort:{price:'asc'}}));
    return 'https://www.pathofexile.com/trade/search/'+encodeURIComponent(meta.league||'')+'?q='+q;
  }catch(e){} }
  return (p && p.trade_url) || '';
}

function pkSyncSurvey(){

function pkApplyTiers(){
  // Redesigned 2026-06-15 to FIND suitable items, not fail to. Thresholds were tuned against
  // live trade result counts (required @80% found 0 on most real items; @60% finds comparables
  // on most while staying on decent rolls; presence-only was too loose / inaccurate):
  //  required -> AND group, each at ~60% of the build's roll (a "roughly this good" comparable);
  //  nice + not-important -> ONE Count group ("has at least ~a third of these bonus mods");
  //  unnecessary / negated-soft -> omitted.
  // We deliberately use a COUNT group, not weighted-sum: the PoE1 trade SEARCH API rejects weight
  // AND weight2 groups with HTTP 400 (verified against every documented format -- they are a
  // UI-only construct), so every old survey with soft mods silently failed to search. A count
  // group is fully supported and finds comparable items reliably.
  const req=pkModel.statRows.filter(r=>r.tier==='required');
  // a 'reduced' (negated) soft mod has a negative basis -> can't sit in a presence count; drop it.
  const isSoft=r=>(r.tier==='nice'||r.tier==='notimp') && !r.negated;
  const soft=pkModel.statRows.filter(isSoft);
  const groups=[]; let andGi=-1,cGi=-1;
  if(req.length){ andGi=groups.length; groups.push({type:'and',min:'',max:''}); }
  if(soft.length){ cGi=groups.length; groups.push({type:'count',min:'',max:''}); }
  if(!groups.length) groups.push({type:'and',min:'',max:''});
  pkModel.groups=groups;
  pkModel.statRows.forEach(r=>{
    if(r.tier==='required'){ r.group=(andGi<0?0:andGi); r.checked=true; r.weight='';
      if(r.negated){ r.min=''; r.max=(r.value!=null?String(r.value):''); }
      else if(r.value!=null){ r.min=String(Math.max(1, Math.round(Math.abs(r.value)*0.6))); r.max=''; }
      else { r.min=''; r.max=''; }   // flag mod (no number) -> presence only
    } else if(isSoft(r)){ r.group=(cGi<0?0:cGi); r.checked=true; r.min=''; r.max=''; r.weight=''; }
    else { r.checked=false; }        // unnecessary, or a negated soft mod -> not searched
  });
  if(cGi>=0){
    // lenient bonus bar: need at least ~a third of the nice/not-important mods present (min 1).
    groups[cGi].min=String(Math.max(1, Math.round(soft.length*0.34)));
  }
  // defence totals -> only "required" ones, searched at ~60% of the roll (matches the stat
  // "required" fraction; tighter values were found to drop borderline armour pieces to zero).
  pkModel.equipRows.forEach(r=>{ r.checked=(r.tier==='required'); r.min=(r.checked&&r.value!=null)?String(Math.round(r.value*0.6)):''; r.max=''; });
}
function pkSurveyRow(rw){
  const isEq=(rw.kind==='equip');
  const shown=rw.value!=null?Math.abs(rw.value):null;
  const txt=shown!=null?E(rw.text).replace(String(shown),`<span class="roll">${E(shown)}</span>`):E(rw.text);
  const note=isEq?' <span class="range">(defence total)</span>':(rw.added?' <span class="range">(off-item)</span>':'');
  const rm=rw.added?`<button class="rowrm" data-rid="${rw.rid}" type="button" title="remove">✕</button>`:'';
  // defence totals go to armour_filters (can't be weighted) -> only Required / Unnecessary;
  // coerce a legacy nice/notimp tier on an equip row to 'required' so the select shows sanely.
  const tiers = isEq ? [['required','Required'],['skip','Unnecessary']] : SURVEY_TIERS;
  if(isEq && rw.tier!=='required' && rw.tier!=='skip') rw.tier='required';
  const sel=`<select class="svtier" data-rid="${rw.rid}">`+tiers.map(([v,l])=>`<option value="${v}" ${rw.tier===v?'selected':''}>${E(l)}</option>`).join('')+`</select>`;
  return `<div class="svrow" data-tier="${E(rw.tier)}" data-rid="${rw.rid}"><div class="svtxt">${txt}${note}</div>${sel}${rm}</div>`;
}
function pkRenderSurvey(){
  const info=pkInfo,r=info.rare;
  const stepHTML=info.single?'':`<span class="step">${info.index+1} / ${info.total}</span>`;
  let h=`<div class="ph">${E(r.name)}${stepHTML}<span class="scope">${E(r.scope||'')}${info.redo?' · re-search to replace':''}</span></div><div class="pbody">`;
  const remain=bpc.remainingRares().length;
  if(!info.single&&remain>1) h+=`<div class="pautoscan"><button class="stone-btn autoscan" id="pSearchAll" type="button" title="price all ${remain} remaining rares automatically with their default all-affix searches">⚡ Autoscan (${remain})</button></div>`;
  h+=`<div class="svtop">Tag how much each mod matters &mdash; the search builds itself. <button class="svlink" id="pToGroups" type="button">edit groups →</button></div>`;
  if(r.pseudo&&r.pseudo.length) h+=`<div class="pseudo-switch ${pkModel.usePseudo?'on':''}" id="pseuSw"><span class="sw"></span><span>Combine elemental resistances</span></div>`;
  h+=`<div class="svlist">`;
  pkModel.statRows.forEach(rw=>h+=pkSurveyRow(rw));
  pkModel.equipRows.forEach(rw=>h+=pkSurveyRow(rw));
  if(!pkModel.statRows.length && !pkModel.equipRows.length) h+=`<div class="grpempty">no searchable mods on this item &mdash; add one below</div>`;
  h+=`</div>`;
  h+=`<div class="addwrap"><button class="addstat" data-gi="0" type="button">+ add stat filter</button></div>`;
  if(pkModel.unsearch.length){
    h+=`<div class="unsrch"><div class="pdiv">not searchable</div>`;
    pkModel.unsearch.forEach(u=>h+=`<div class="afx no r4"><div class="abullet"></div><div class="atext">${E(u.text)}<span class="reason">${E(u.reason||'')}</span></div><div></div><div></div></div>`);
    h+=`</div>`;
  }
  h+=`<div class="ptrade"><button class="stone-btn viewtrade" id="pViewTrade" type="button">↗ open this search on the trade site</button></div>`;
  h+=`<div class="pbtns">${(!info.single&&info.index>0)?'<button class="stone-btn" id="pBack" type="button">← Back</button>':''}<button class="stone-btn skip" id="pSkip" type="button">Skip</button><button class="stone-btn search" id="pSearch" type="button">${info.redo?'Re-search':'Search'}</button></div>`;
  if(!info.single&&remain>1) h+=`<div class="pbulk"><button class="stone-btn pa-skip small" id="pSkipAll" type="button">skip all (don't price)</button></div>`;
  h+=`</div>`;
  pick.innerHTML=h; pickwrap.classList.add('show'); pkWireSurvey();
}
function pkWireSurvey(){
  const info=pkInfo;
  pick.querySelectorAll('.svtier').forEach(s=>s.onchange=()=>{
    const rw=pkModel.statRows.concat(pkModel.equipRows).find(r=>String(r.rid)===s.dataset.rid);
    if(rw) rw.tier=s.value; const row=s.closest('.svrow'); if(row) row.dataset.tier=s.value;
  });
  const sw=$('#pseuSw'); if(sw) sw.onclick=()=>{ pkSyncSurvey(); pkSaveState(); pkModel.usePseudo=!pkModel.usePseudo; pkBuildRows(); pkRenderSurvey(); };
  const tg=$('#pToGroups'); if(tg) tg.onclick=()=>{ pkSyncSurvey(); pkApplyTiers(); pkModel.view='groups'; pkRender(); };
  pick.querySelectorAll('.addstat').forEach(btn=>btn.onclick=()=>pkOpenAddStat(btn));
  pick.querySelectorAll('.rowrm').forEach(b=>b.onclick=()=>pkRemoveStat(b.dataset.rid));
  const vt=$('#pViewTrade'); if(vt) vt.onclick=()=>{ pkSyncSurvey(); pkApplyTiers(); pkViewTrade(pkBuildPayload()); };
  const bk=$('#pBack'); if(bk) bk.onclick=()=>bpc.backRare();
  $('#pSkip').onclick=()=>bpc.skipRare(info.key);
  $('#pSearch').onclick=()=>{ pkSyncSurvey(); pkApplyTiers(); pkSubmit(); };
  const sa=$('#pSearchAll'); if(sa) sa.onclick=()=>bpc.searchAllRares();
  const ka=$('#pSkipAll'); if(ka) ka.onclick=()=>bpc.skipAllRares();
}
/* ---------- CLASSIC flat affix picker (toggle) — the old "check mods to require" behavior ---------- */
function pkRenderClassic(){
  const info=pkInfo,r=info.rare;
  const stepHTML=info.single?'':`<span class="step">${info.index+1} / ${info.total}</span>`;
  let h=`<div class="ph">${E(r.name)}${stepHTML}<span class="scope">${E(r.scope||'')}${info.redo?' · re-search to replace':''}</span></div><div class="pbody">`;
  const remain=bpc.remainingRares().length;
  if(!info.single&&remain>1) h+=`<div class="pautoscan"><button class="stone-btn autoscan" id="pSearchAll" type="button" title="price all ${remain} remaining rares automatically with their default all-affix searches">⚡ Autoscan (${remain})</button></div>`;
  h+=`<div class="svtop">Classic: tick the affixes a match must have (all required); set min/max.</div>`;
  if(r.pseudo&&r.pseudo.length) h+=`<div class="pseudo-switch ${pkModel.usePseudo?'on':''}" id="pseuSw"><span class="sw"></span><span>Combine elemental resistances</span></div>`;
  h+=`<div class="grpbox"><div class="grphd"><span class="grptitle">Affixes (all required)</span></div>`+pkAfxHead('and');
  pkModel.statRows.forEach(rw=>h+=pkRowHTML(rw,'and'));
  if(!pkModel.statRows.length) h+=`<div class="grpempty">no searchable mods on this item &mdash; add one below</div>`;
  h+=`</div>`;
  if(pkModel.equipRows.length){
    h+=`<div class="grpbox eqbox"><div class="grphd"><span class="grptitle">Defence totals</span></div>`+pkAfxHead('__eq');
    pkModel.equipRows.forEach(rw=>h+=pkRowHTML(rw,'__eq')); h+=`</div>`;
  }
  h+=`<div class="addwrap"><button class="addstat" data-gi="0" type="button">+ add stat filter</button></div>`;
  if(pkModel.unsearch.length){
    h+=`<div class="unsrch"><div class="pdiv">not searchable</div>`;
    pkModel.unsearch.forEach(u=>h+=`<div class="afx no r4"><div class="abullet"></div><div class="atext">${E(u.text)}<span class="reason">${E(u.reason||'')}</span></div><div></div><div></div></div>`);
    h+=`</div>`;
  }
  h+=`<div class="ptrade"><button class="stone-btn viewtrade" id="pViewTrade" type="button">↗ open this search on the trade site</button></div>`;
  h+=`<div class="pbtns">${(!info.single&&info.index>0)?'<button class="stone-btn" id="pBack" type="button">← Back</button>':''}<button class="stone-btn skip" id="pSkip" type="button">Skip</button><button class="stone-btn search" id="pSearch" type="button">${info.redo?'Re-search':'Search'}</button></div>`;
  if(!info.single&&remain>1) h+=`<div class="pbulk"><button class="stone-btn pa-skip small" id="pSkipAll" type="button">skip all (don't price)</button></div>`;
  h+=`</div>`;
  pick.innerHTML=h; pickwrap.classList.add('show'); pkWireClassic();
}
function pkWireClassic(){
  const info=pkInfo;
  const sw=$('#pseuSw'); if(sw) sw.onclick=()=>{ pkSyncDOM(); pkSaveState(); pkModel.usePseudo=!pkModel.usePseudo; pkBuildRows(); pkRenderClassic(); };
  pick.querySelectorAll('.amin,.amax').forEach(inp=>inp.addEventListener('focus',()=>{
    const cb=pick.querySelector('.acb[data-rid="'+inp.dataset.rid+'"]'); if(cb) cb.checked=true; }));
  pick.querySelectorAll('.addstat').forEach(btn=>btn.onclick=()=>pkOpenAddStat(btn));
  pick.querySelectorAll('.rowrm').forEach(b=>b.onclick=()=>pkRemoveStat(b.dataset.rid));
  const vt=$('#pViewTrade'); if(vt) vt.onclick=()=>pkViewTrade(pkBuildPayloadClassic());
  const bk=$('#pBack'); if(bk) bk.onclick=()=>bpc.backRare();
  $('#pSkip').onclick=()=>bpc.skipRare(info.key);
  $('#pSearch').onclick=pkSubmitClassic;
  const sa=$('#pSearchAll'); if(sa) sa.onclick=()=>bpc.searchAllRares();
  const ka=$('#pSkipAll'); if(ka) ka.onclick=()=>bpc.skipAllRares();
}
function pkBuildPayloadClassic(){
  pkSyncDOM();
  const filters=pkModel.statRows.filter(rw=>rw.checked).map(rw=>({stat_id:rw.stat_id, min:numv(rw.min), max:numv(rw.max)}));
  const equip=pkModel.equipRows.filter(rw=>rw.checked).map(rw=>({key:rw.key, min:numv(rw.min), max:numv(rw.max)}));
  return {groups:(filters.length?[{type:'and',filters}]:[]), equip};
}
function pkSubmitClassic(){ bpc.submitRare(pkInfo.key, pkBuildPayloadClassic()); }
function numv(s){ s=(''+(s==null?'':s)).trim(); if(!s) return null; const n=Number(s); return isNaN(n)?null:n; }
// close picker on backdrop click (does NOT decide the rare; just dismiss)
pickwrap.addEventListener('click',e=>{ if(e.target===pickwrap){ if(curRare) bpc.skipRare(curRare.key); }});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && curRare) bpc.skipRare(curRare.key); });

/* ---------- boot ---------- */
/* All bpc.on(...) handlers above are registered before init() runs, so the
   meta/items/priced/totals events emitted during loadMock are caught and render
   the banner, board and orb. No post-init re-render needed. */
if(location.search.indexOf('mock')>=0){ bpc.init({mock:true}); syncControls(); }
else { bpc.init(); }
</script>
