<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { width: 340px; margin: 0; padding: 12px 14px; font: 13px/1.4 system-ui, Segoe UI, sans-serif;
         background: #15171c; color: #d7dae0; }
  h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .04em; text-transform: uppercase; color: #c9a24a; }
  .sub { color: #8b919c; font-size: 11px; margin-bottom: 10px; }
  textarea { width: 100%; box-sizing: border-box; height: 64px; resize: vertical; background: #0f1116;
             color: #d7dae0; border: 1px solid #2a2e37; border-radius: 6px; padding: 7px; font: 11px ui-monospace, monospace; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  button { background: #2a2e37; color: #e7e9ee; border: 1px solid #3a3f4b; border-radius: 6px;
           padding: 7px 12px; cursor: pointer; font-size: 12px; }
  button.primary { background: #c9a24a; color: #1a1308; border-color: #c9a24a; font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  #out { margin-top: 10px; padding: 9px; border-radius: 6px; background: #0f1116; border: 1px solid #2a2e37;
         min-height: 20px; font-size: 12px; white-space: pre-wrap; }
  .ok { color: #6fcf7f; } .err { color: #e06b5b; } .muted { color: #8b919c; }
  .price { font-size: 16px; font-weight: 700; color: #f0d27a; }
  a { color: #7fb1ff; }
</style>
</head>
<body>
  <h1>PoE1 Trade Bridge</h1>
  <div class="sub" id="status">checking…</div>
  <div class="muted" style="font-size:11px;margin-bottom:6px">
    Paste a PoE1 trade link (the <code>?q=</code> link this site generates) or a raw query JSON to test live pricing from your IP:
  </div>
  <textarea id="in" placeholder="https://www.pathofexile.com/trade/search/Allflame?q=%7B...%7D"></textarea>
  <div class="row">
    <button class="primary" id="price">Price it</button>
    <button id="reset" title="clear the local rate-limit window">reset limits</button>
  </div>
  <div id="out" class="muted">results appear here</div>
  <script src="popup.js"></script>
</body>
</html>
